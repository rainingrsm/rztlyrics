[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "rztlyrics-backend"
version = "0.0.0"
description = "Учебный каркас API и renderer для RZT Lyrics"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "rq>=2.0,<3",
  "redis>=5,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "renderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
